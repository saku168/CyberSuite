name: Build Windows executable

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cybersuite-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Check Python syntax
        run: python -m py_compile main.py scripts/generate_icon.py

      - name: Generate Windows icon
        run: python scripts/generate_icon.py

      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --icon assets/cybersuite.ico --add-data "assets/cybersuite.ico;assets" --name CyberSuite main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberSuite-Windows
          path: dist/CyberSuite.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CyberSuite.exe
          generate_release_notes: true
